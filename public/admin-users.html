<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Users & Conversations · Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
<link rel="icon" href="logo.png" />
</head>
<body>
<div id="shell"></div>
<script src="admin-common.js"></script>
<script>
(async function () {
  if (!(await AdminUtils.ensureAdmin())) return;

  document.getElementById("shell").innerHTML = `
    ${AdminUtils.renderSidebar("users")}
    <main class="admin-main">
      <div class="admin-head">
        <h1>👥 Users & Conversations</h1>
        <div class="who">Xem hồ sơ + lịch sử chat + ảnh đã gửi</div>
      </div>
      <div class="users-grid">
        <div class="panel user-list">
          <input id="q" placeholder="Tìm theo tên / bệnh lý..." class="btn" style="width:100%;margin-bottom:10px"/>
          <div id="ulist"><div class="skeleton" style="height:30px;margin:6px 0"></div></div>
        </div>
        <div>
          <div class="panel" id="profile-card"><div class="empty">← Chọn 1 user để xem chi tiết</div></div>
          <div class="panel" id="conv-card" style="display:none">
            <h2>💬 Lịch sử trò chuyện</h2>
            <div class="conv" id="conv"></div>
          </div>
          <div class="panel" id="media-card" style="display:none">
            <h2>🖼️ Ảnh đã gửi</h2>
            <div class="media-grid" id="media"></div>
          </div>
        </div>
      </div>
    </main>
  `;

  let users = [];
  let selectedId = null;

  async function loadUsers() {
    const data = await AdminUtils.api("/api/admin/users");
    users = data.users || [];
    renderList();
  }

  function renderList() {
    const q = (document.getElementById("q").value || "").toLowerCase().trim();
    const filtered = users.filter(
      (u) => !q || (u.username || "").toLowerCase().includes(q) || (u.disease || "").toLowerCase().includes(q)
    );
    const ul = document.getElementById("ulist");
    if (!filtered.length) {
      ul.innerHTML = `<div class="empty">Không có user</div>`;
      return;
    }
    ul.innerHTML = filtered
      .map(
        (u) => `<div class="u ${u.id === selectedId ? "active" : ""}" data-id="${u.id}">
          <div class="name">${u.username || u.id.slice(0, 8)} ${u.is_admin ? '<span class="tag ready">admin</span>' : ""}</div>
          <div class="meta">${u.disease || "—"} · ${u.goal || "—"} · ${AdminUtils.fmtDate(u.created_at)}</div>
        </div>`
      )
      .join("");
    ul.querySelectorAll(".u").forEach((el) => {
      el.onclick = () => loadDetail(el.dataset.id);
    });
  }

  document.getElementById("q").addEventListener("input", renderList);

  async function loadDetail(id) {
    selectedId = id;
    renderList();
    const card = document.getElementById("profile-card");
    card.innerHTML = `<div class="skeleton" style="height:80px"></div>`;
    document.getElementById("conv-card").style.display = "none";
    document.getElementById("media-card").style.display = "none";

    const data = await AdminUtils.api("/api/admin/users?id=" + id);
    const p = data.profile || {};
    card.innerHTML = `
      <h2>👤 ${p.username || "—"}</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
        ${kv("Năm sinh", p.birth_year)}
        ${kv("Giới tính", p.gender)}
        ${kv("Cân nặng", p.weight ? p.weight + " kg" : "—")}
        ${kv("Chiều cao", p.height ? p.height + " cm" : "—")}
        ${kv("Bệnh lý", p.disease || "—")}
        ${kv("Mục tiêu", p.goal)}
        ${kv("Calo/ngày", p.target_calories)}
        ${kv("Ngày tạo", AdminUtils.fmtDate(p.created_at))}
      </div>
    `;

    const hist = Array.isArray(p.chat_history) ? p.chat_history : [];
    const conv = document.getElementById("conv");
    document.getElementById("conv-card").style.display = "";
    if (!hist.length) {
      conv.innerHTML = `<div class="empty">Chưa có hội thoại</div>`;
    } else {
      conv.innerHTML = hist
        .map((m) => {
          const role = m.role === "user" ? "user" : "assistant";
          let txt = String(m.content || "");
          txt = txt.replace(/<data>[\s\S]*?<\/data>/g, "").replace(/<error>[\s\S]*?<\/error>/g, "").trim();
          const img = m.imageUrl ? `<img src="${m.imageUrl}" alt="upload"/>` : "";
          return `<div class="msg ${role}">${escapeHtml(txt) || "[ảnh]"}${img}</div>`;
        })
        .join("");
      conv.scrollTop = conv.scrollHeight;
    }

    const imgs = data.images || [];
    document.getElementById("media-card").style.display = "";
    const media = document.getElementById("media");
    if (!imgs.length) {
      media.innerHTML = `<div class="empty">Chưa có ảnh nào</div>`;
    } else {
      media.innerHTML = imgs
        .map((i) => `<a class="ph" href="${i.cloudinary_url}" target="_blank">
          <img loading="lazy" src="${i.cloudinary_url.replace("/upload/", "/upload/f_auto,q_auto,w_320/")}" />
        </a>`)
        .join("");
    }
  }

  function kv(k, v) {
    return `<div style="background:#fafbff;border:1px solid #e6e9f2;border-radius:10px;padding:8px 10px">
      <div style="font-size:11px;color:#5b6478;text-transform:uppercase">${k}</div>
      <div style="font-weight:700">${v ?? "—"}</div></div>`;
  }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  loadUsers();
})();
</script>
</body>
</html>
